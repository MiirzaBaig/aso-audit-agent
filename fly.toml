# Fly.io config for the Mastra audit server.
app = "aso-audit-server"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NIM_MODEL = "openai/gpt-oss-120b"
  LIBSQL_URL = "file:./aso-audit.db"
  ENABLE_OCR = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
